<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>StreakFC Console</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--bg:#05070c;--bg2:#0f1520;--bg3:#151d2e;--border:#1e2a3d;--text:#e8edf5;--sub:#6b7fa0;--accent:#f97316;--green:#22c55e;--red:#ef4444;--blue:#4fc3f7;--amber:#f59e0b;--violet:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:9px 11px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.btn{background:var(--accent);color:#140700;border:none;border-radius:9px;padding:9px 14px;font-weight:800;letter-spacing:.3px}
.btn.ghost{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}
/* login */
#login{max-width:380px;margin:12vh auto;padding:28px;background:var(--bg2);border:1px solid var(--border);border-radius:18px;display:none}
#login h1{font-family:Impact,"Arial Narrow Bold",sans-serif;letter-spacing:1px;font-size:26px}
#login p{color:var(--sub);margin:6px 0 18px;font-size:13px}
#login input{width:100%;margin-bottom:10px}#login .btn{width:100%}
#loginStatus{font-size:12px;margin-top:10px;color:var(--sub)}
/* shell */
#app{display:none;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:220px;background:#03050a;border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:3px}
.brand{font-family:Impact,"Arial Narrow Bold",sans-serif;font-size:20px;letter-spacing:1px;padding:0 10px}.brand span{color:var(--accent)}
.brand-sub{font-size:10px;letter-spacing:2px;color:var(--sub);font-weight:800;padding:0 10px;margin:2px 0 22px}
.nav{padding:9px 12px;border-radius:9px;font-weight:700;color:var(--sub);display:flex;gap:10px;align-items:center;cursor:pointer;user-select:none}
.nav:hover{color:var(--text)}.nav.on{background:#f973161f;color:var(--accent)}
.nav .n{margin-left:auto;font-size:11px;color:var(--sub)}
.sep{font-size:10px;letter-spacing:2px;color:#41526d;font-weight:800;margin:16px 12px 6px}
.side-foot{margin-top:auto;font-size:11px;color:var(--sub);padding:0 10px}
.side-foot a{color:var(--sub)}
.main{margin-left:220px;padding:26px 32px 60px;max-width:1500px}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.hdr h2{font-size:24px;font-weight:900;letter-spacing:-.3px}.hdr .s{color:var(--sub);font-size:13px;margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.kpi b{font-size:26px;font-weight:900;display:block;font-variant-numeric:tabular-nums}.kpi span{font-size:10px;letter-spacing:1.5px;color:var(--sub);font-weight:800}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.card-h{font-size:11px;letter-spacing:2px;color:var(--sub);font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;letter-spacing:1.4px;color:var(--sub);font-weight:800;padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:9px 8px;border-bottom:1px solid #121a28;vertical-align:top}
tr:hover td{background:#0c121c}
.num{text-align:right;font-variant-numeric:tabular-nums}
.kid{display:flex;gap:9px;align-items:center;font-weight:800;cursor:pointer}
.dot{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#04101a;flex:none}
.chip{display:inline-block;font-size:10px;font-weight:900;padding:2px 7px;border-radius:6px;letter-spacing:.5px;margin-right:4px}
.c-green{background:#22c55e22;color:var(--green)}.c-amber{background:#f59e0b22;color:var(--amber)}.c-red{background:#ef444422;color:var(--red)}.c-violet{background:#a78bfa26;color:var(--violet)}.c-teal{background:#1ab3bd26;color:#1ab3bd}.c-blue{background:#4fc3f722;color:var(--blue)}.c-sub{background:var(--bg3);color:var(--sub)}
.muted{color:var(--sub)}.small{font-size:12px}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:6px}
.bar{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;position:relative;opacity:.85}
.bar:hover{opacity:1}.bar.zero{background:var(--border)}
.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10px;color:var(--sub);margin-bottom:2px}
.bar-x{display:flex;gap:4px;margin-top:5px}.bar-x div{flex:1;font-size:9px;color:var(--sub);text-align:center}
.ticks{display:flex;gap:4px}.tick{width:30px;height:24px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:var(--sub)}
.tick.on{background:#22c55e26;border-color:var(--green);color:var(--green)}.tick.off{opacity:.35}.tick.today{border-color:var(--accent)}
.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.feed-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #121a28;font-size:13px}
.feed-row .t{width:120px;color:var(--sub);font-size:12px;flex:none}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg2);border-left:1px solid var(--border);padding:22px;overflow:auto;transform:translateX(100%);transition:transform .2s;z-index:10}
#drawer.open{transform:none}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border);padding:10px 16px;border-radius:10px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
.empty{color:var(--sub);padding:18px 0;text-align:center}
.legend{font-size:11px;color:var(--sub)}
.mode{display:flex;gap:4px;align-items:center;margin-bottom:12px}.mode span{font-size:9px;letter-spacing:1.5px;font-weight:800;margin-right:4px}
.mode-btn{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--sub);border-radius:7px;padding:5px 0;font-size:10px;font-weight:900;letter-spacing:1px}
.mode-btn.on[data-m=live]{border-color:var(--green);color:var(--green)}.mode-btn.on[data-m=sandbox]{border-color:#1ab3bd;color:#1ab3bd;background:#1ab3bd1a}
.sandbox-banner{background:#1ab3bd14;border:1px dashed #1ab3bd88;color:#9fe3e8;border-radius:12px;padding:10px 14px;font-size:12px;margin-bottom:16px}
.hm-table td,.hm-table th{text-align:center;padding:8px 6px}.hm{font-weight:900;color:#e8fbfc;border:2px solid var(--bg2);border-radius:6px}.hm-empty{background:transparent}
.add-btn{font-size:14px;padding:11px 18px;box-shadow:0 0 0 3px #f9731633}
.kpis-sm .kpi{padding:10px 14px}.kpis-sm .kpi b{font-size:20px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px}.tab{background:none;border:none;color:var(--sub);font-weight:800;padding:10px 14px;border-bottom:2px solid transparent;margin-bottom:-1px}.tab.on{color:var(--text);border-bottom-color:#1ab3bd}.tab span{font-size:11px;color:var(--sub);margin-left:2px}
.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.seg{background:var(--bg3);border:1px solid var(--border);color:var(--sub);border-radius:8px;padding:6px 11px;font-weight:800;font-size:12px}.seg.on{border-color:#1ab3bd;color:#1ab3bd;background:#1ab3bd1a}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
table.tight td{padding:6px 8px;vertical-align:middle}tr.click{cursor:pointer}
.week-row{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}.week-lbl{width:120px;flex:none;display:flex;flex-direction:column;gap:3px;font-size:12px}.week-lbl b{font-size:10px;letter-spacing:1.5px;color:var(--sub)}
.week-plans{flex:1;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}.plan-card{background:var(--bg3);border:1px solid var(--border);border-left:3px solid #4fc3f7;border-radius:10px;padding:9px 12px;min-width:220px;cursor:pointer}.plan-card:hover{border-color:#4fc3f7}
.plan-who{font-size:10px;letter-spacing:1px;color:#4fc3f7;font-weight:800}.plan-main{font-weight:800;margin:3px 0}.plan-emph{display:flex;flex-wrap:wrap;gap:4px}.plan-emph span{font-size:10px;background:var(--bg2);border-radius:5px;padding:2px 6px;color:var(--sub);font-weight:700}
.plan-add{background:none;border:1px dashed var(--border);color:var(--sub);border-radius:10px;padding:14px 16px;font-weight:800}
.pf{margin-top:14px;display:flex;flex-direction:column;gap:6px}.pf label{font-size:10px;letter-spacing:1.5px;color:var(--sub);font-weight:800}.day-line{display:flex;gap:8px;align-items:center}.day-line span{width:80px;font-size:12px;font-weight:800}.day-line input{flex:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal-h{font-size:10px;letter-spacing:1.5px;color:var(--sub);font-weight:800;padding:4px}
.cal-d{min-height:92px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:3px;font-size:11px}.cal-d.dim{opacity:.35}.cal-d.today{border-color:var(--accent)}.cal-d.epa{border-left:3px solid #1ab3bd}.cal-d.off{background:#f59e0b0d}
.cal-n{font-weight:900;font-size:12px}.cal-epa{color:#1ab3bd;font-weight:800;font-size:10px}.cal-plan{background:#4fc3f726;color:#4fc3f7;border-radius:5px;padding:2px 5px;font-weight:800;font-size:10px;cursor:pointer}.cal-note{color:var(--sub);font-size:10px;line-height:1.25}
.timeline{border-left:2px solid var(--border);margin-left:6px;padding-left:16px}.node{position:relative;padding:0 0 14px}.node-dot{position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:#1ab3bd;border:2px solid var(--bg2)}.node-body{display:flex;flex-direction:column;gap:3px}
.grp-row{font-size:10px;letter-spacing:2px;font-weight:900;color:#1ab3bd;background:#1ab3bd0f;padding:7px 8px}
textarea{font:inherit;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:9px 11px;outline:none;resize:vertical}
.kid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.kt{background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--sub);border-radius:10px;padding:10px;font-size:12px;display:flex;flex-direction:column;gap:4px}
.kt span{color:var(--sub);font-size:11px}.kt.hot{border-left-color:var(--green)}.kt.warm{border-left-color:var(--amber)}.kt.cold{border-left-color:var(--red)}.kt.invited{opacity:.5;border-left-style:dashed}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px}.spark i{flex:1;background:#1ab3bd;border-radius:2px}.spark i.z{background:var(--border)}
.meter{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;min-width:120px}.meter div{height:6px;background:#1ab3bd}
@media (max-width:900px){.side{position:static;width:auto;flex-direction:row;flex-wrap:wrap;padding:12px}.side-foot,.sep,.brand-sub{display:none}.main{margin-left:0;padding:16px}.grid2{grid-template-columns:1fr}}
</style></head>
<body>
<div id="login">
  <h1>STREAK<span style="color:var(--accent)">FC</span> CONSOLE</h1>
  <p>Admin and coach access. Same email you use for StreakFC.</p>
  <input id="email" type="email" placeholder="you@email.com" autocomplete="email">
  <button class="btn" id="sendBtn" onclick="sendCode()">SEND CODE</button>
  <div id="codeWrap" style="display:none;margin-top:12px"><input id="code" inputmode="numeric" maxlength="8" placeholder="6-digit code"><button class="btn" onclick="verify()">SIGN IN</button></div>
  <div id="loginStatus"></div>
</div>

<div id="app">
  <aside class="side">
    <div class="brand">STREAK<span>FC</span></div><div class="brand-sub">CONSOLE · ADMIN</div>
    <div class="nav" data-v="overview">📊 Overview</div>
    <div class="nav" data-v="kids">👟 Kids <span class="n" id="nKids"></span></div>
    <div class="nav" data-v="families">🏠 Families <span class="n" id="nFams"></span></div>
    <div class="nav" data-v="activity">⚡ Activity</div>
    <div class="sep">CLUB <span class="chip c-teal" style="margin-left:4px">SANDBOX</span></div>
    <div class="nav" data-v="club">🏆 Club</div>
    <div class="nav" data-v="teams">👥 Teams</div>
    <div class="nav" data-v="coaches">🧢 Coaches</div>
    <div class="nav" data-v="seats">🎟 Seats + billing</div>
    <div class="sep">TRAINER <span class="chip c-teal" style="margin-left:4px">SANDBOX</span></div>
    <div class="nav" data-v="trainer">🎯 1:1 Training</div>
    <div class="sep">PROGRAMS</div>
    <div class="nav" data-v="epa">🏟 EPA <span class="chip c-teal" style="margin-left:auto">BETA</span></div>
    <div class="side-foot"><div class="mode"><span>DATA</span><button class="mode-btn" data-m="live" onclick="setMode('live')">LIVE</button><button class="mode-btn" data-m="sandbox" onclick="setMode('sandbox')">SANDBOX</button></div><div id="who"></div><div style="margin-top:6px"><a href="#" onclick="refresh();return false">Refresh</a> · <a href="#" onclick="signOut();return false">Sign out</a></div><div style="margin-top:6px"><a href="/">Open app</a></div></div>
  </aside>
  <main class="main" id="view"></main>
</div>
<div id="drawer"></div>
<div id="toast"></div>

<script>
const SB_URL = 'https://zrdtwiuekozfteaurrzp.supabase.co';
const SB_KEY = 'sb_publishable_KFpa8NmzxgtF_r2UX2se_Q_8UoN1hbc';
// Keep in sync with index.html PROGRAMS / FOCUS
const PROGRAMS = {epa:{name:'EPA', days:[2,3,4], mins:90, start:'2026-07-28', end:'2027-05-27',
  off:[['2026-11-11','2026-11-11','Veterans Day'],['2026-11-25','2026-11-27','Thanksgiving'],['2026-12-21','2027-01-03','Winter Break'],
       ['2027-01-18','2027-01-18','MLK Day'],['2027-02-15','2027-02-15','Presidents Day'],['2027-03-15','2027-03-28','Spring Break']]}};
const FOCUS = {technical:{name:'Technical',ico:'⚽',touches:1200},mixed:{name:'Mixed',ico:'🔀',touches:700},tactical:{name:'Small-sided / tactical',ico:'🧠',touches:500},speed:{name:'Speed + agility',ico:'⚡',touches:200}};
const FEELS = ['😫','😐','🙂','🔥'];
const MODE = {film:'Game analysis', goalsheet:'Goal worksheet', goal:'Home session', timed:'Timed test', recovery:'Recovery', parent:'Parent log', epa:'EPA session', checkin:'Check-in', weekly:'Weekly journal'};

let session = null, REAL = null, D = null, view = 'overview', sortKey = {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n||0).toLocaleString();
const fmtK = n => { n = n||0; if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'') + 'M'; return n < 1000 ? String(n) : (n/1000).toFixed(n < 10000 ? 1 : 0).replace(/\.0$/,'') + 'K'; };
function localDate(d = new Date()) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function daysAgo(n) { const d = new Date(); d.setDate(d.getDate()-n); return localDate(d); }
function weekDates(off=0) { const d = new Date(); d.setDate(d.getDate() - (d.getDay()+6)%7 + off*7); return [...Array(7)].map((_,i) => { const x = new Date(d); x.setDate(d.getDate()+i); return localDate(x); }); }
function wdOf(s) { return new Date(s+'T12:00:00').getDay(); }
function epaOff(s) { return PROGRAMS.epa.off.find(([a,b]) => s >= a && s <= b); }
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400); }
function ago(ds) { if (!ds) return '<span class="muted">never</span>'; const n = Math.round((new Date(localDate()+'T12:00') - new Date(ds+'T12:00'))/864e5); return n <= 0 ? '<span class="chip c-green">TODAY</span>' : n === 1 ? 'yesterday' : `${n}d ago`; }

// ── auth (shares the app's sign-in on this browser) ──
function saveSession(d) { session = {access_token:d.access_token, refresh_token:d.refresh_token, expires_at: d.expires_at || (Math.floor(Date.now()/1000) + (+d.expires_in||3600))}; localStorage.setItem('sfc_session', JSON.stringify(session)); }
async function refreshSession() {
  if (!session?.refresh_token) return false;
  const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, {method:'POST', headers:{'apikey':SB_KEY,'Content-Type':'application/json'}, body:JSON.stringify({refresh_token:session.refresh_token})});
  if (!r.ok) return false; saveSession(await r.json()); return true;
}
async function rpc(fn, args={}) {
  if (session && session.expires_at - 60 < Date.now()/1000) await refreshSession();
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {method:'POST', headers:{'apikey':SB_KEY,'Content-Type':'application/json','Authorization':`Bearer ${session?.access_token||SB_KEY}`}, body:JSON.stringify(args)});
  const t = await r.text(); if (!r.ok) { let m = 'error_'+r.status; try { m = JSON.parse(t).message || m; } catch(e) {} throw new Error(m); }
  return t ? JSON.parse(t) : null;
}
async function sendCode() {
  const email = $('email').value.trim(); if (!email) return;
  $('sendBtn').disabled = true;
  const r = await fetch(`${SB_URL}/auth/v1/otp`, {method:'POST', headers:{'apikey':SB_KEY,'Content-Type':'application/json'}, body:JSON.stringify({email, create_user:false})});
  $('sendBtn').disabled = false;
  $('loginStatus').textContent = r.ok ? 'Code sent. Check your email.' : (r.status === 429 ? 'Too many requests, wait a minute.' : 'Could not send. Use the email you use in StreakFC.');
  if (r.ok) { $('codeWrap').style.display = 'block'; $('code').focus(); }
}
async function verify() {
  const r = await fetch(`${SB_URL}/auth/v1/verify`, {method:'POST', headers:{'apikey':SB_KEY,'Content-Type':'application/json'}, body:JSON.stringify({type:'email', email:$('email').value.trim(), token:$('code').value.replace(/\D/g,'')})});
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.access_token) { $('loginStatus').textContent = d.msg || 'Code invalid or expired'; return; }
  saveSession(d); boot();
}
function signOut() { localStorage.removeItem('sfc_session'); location.reload(); }
function showLogin(msg) { $('app').style.display = 'none'; $('login').style.display = 'block'; if (msg) $('loginStatus').textContent = msg; }

async function boot() {
  try { session = JSON.parse(localStorage.getItem('sfc_session')||'null'); } catch(e) {}
  if (!session) return showLogin();
  try {
    if (!(await rpc('sfc_is_admin'))) return showLogin('This account is not an admin. Coach access is coming.');
    const u = await fetch(`${SB_URL}/auth/v1/user`, {headers:{'apikey':SB_KEY,'Authorization':`Bearer ${session.access_token}`}}).then(r => r.json()).catch(() => ({}));
    $('who').textContent = u.email || '';
    await refresh(true);
    $('login').style.display = 'none'; $('app').style.display = 'block';
    const h = location.hash.slice(1); paintMode(); go(['overview','kids','families','activity','epa','club','teams','coaches','seats','trainer'].includes(h) ? h : 'overview');
  } catch(e) { if (/JWT|401|expired/i.test(e.message) && await refreshSession()) return boot(); showLogin('Sign in again: ' + e.message); }
}
async function refresh(silent) {
  const raw = await rpc('sfc_admin_data', {p_days:60});
  const fams = Object.fromEntries(raw.families.map(f => [f.id, f]));
  const players = raw.players.map(p => ({...p, fam:fams[p.family_id]||{}, sess:raw.sessions.filter(s => s.player_id === p.id)}));
  let notes = {}, plans = []; try { notes = await rpc('sfc_admin_notes') || {}; } catch(e) {} try { plans = await rpc('sfc_admin_plans') || []; } catch(e) {}
  REAL = D = {...raw, fams, players, notes, plans, byId:Object.fromEntries(players.map(p => [p.id, p]))};
  $('nKids').textContent = players.length; $('nFams').textContent = raw.families.length;
  if (!silent) { render(); toast('Refreshed'); }
}
document.querySelectorAll('.nav').forEach(n => n.onclick = () => go(n.dataset.v));
function go(v) { if (v !== 'coaches' && v !== 'teams' && v !== 'club') coachLens = null; view = v; location.hash = v; document.querySelectorAll('.nav').forEach(n => n.classList.toggle('on', n.dataset.v === v)); render(); }

      <div class="timeline">${k.lessons.map(l => `<div class="node"><div class="node-dot"></div><div class="node-body"><div><b>${l.date}</b> <span class="muted small">${esc(l.type)}</span> · <b>${esc(l.focus)}</b></div>
        <div class="small muted">Plan: ${l.plan.map(esc).join(' · ')}</div><div class="small">📝 ${esc(l.session)}</div><div class="small" style="color:var(--red)">🔒 ${esc(l.training)}</div><div class="small" style="color:#1ab3bd">👪 ${esc(l.parent)}</div>
        <div class="small muted">🏠 Home: ${fmt(l.home.touches)}/day · ${l.home.days}x · ${l.home.drills.map(esc).join(', ')}</div></div></div>`).join('')}</div></div>`;
  dr.classList.add('open');
}
function trLog(id) {
  const k = tr().kids.find(x => x.id === id), v = i => $(i).value.trim();
  if (!v('trFocus')) return toast('Add a focus first');
  k.lessons.unshift({date: localDate(), ago: 0, type: '1:1 · 60 min', focus: v('trFocus'), plan: v('trPlan') ? v('trPlan').split(',').map(x => x.trim()) : [], session: v('trSess'), training: v('trTrain'), parent: v('trPar'), home: k.hw});
  toast('Sandbox: session logged here only'); trOpen(id); render();
}
function trInvite() {
  $('drawer').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:20px;font-weight:900">Add a player</div><button class="btn ghost sm" onclick="$('drawer').classList.remove('open')">Close</button></div>
    <div class="card" style="margin-top:14px"><div class="card-h">YOUR TRAINER CODE</div><div style="font-size:34px;font-weight:900;letter-spacing:6px;color:#1ab3bd">TRN-4K7Q</div>
    <div class="small muted" style="margin-top:8px">Parent opens StreakFC → their player → Trainers → enters this code. They approve what you can see and can remove you anytime. Their player then shows in your list and you show in their app.</div></div>
    <div class="card"><div class="card-h">WHAT YOU SEE ONCE LINKED</div><div class="small">Nickname, age group, positions, home touches + streak, check-ins, journals they choose to share. Never contact info.</div></div>`;
  $('drawer').classList.add('open');
}
function trRename() { const n = prompt('Trainer business name for demos', tr().name); if (n) { localStorage.setItem('sfc_trainer_name', n.slice(0, 40)); tr().name = n.slice(0, 40); render(); } }

boot();
</script>
</body></html>
